<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vicar</title>
<meta name="description" content="Better pay for the people who do the hard work. Coming soon.">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f6f3ee; color: #1f2a37; padding: 32px 20px; }
  main { max-width: 640px; text-align: center; }
  h1 { font-size: clamp(3rem, 12vw, 5.5rem); letter-spacing: .02em; margin: 0 0 .25em; color: #13314f; }
  .tag { font-size: clamp(1.3rem, 4.5vw, 1.8rem); font-weight: 600; margin: 0 0 1em; }
  p { font-size: 1.1rem; line-height: 1.6; margin: 0 0 1.5em; color: #374151; }
  .soon { display: inline-block; padding: .55em 1.2em; border: 2px solid #13314f; border-radius: 999px;
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .9rem; color: #13314f; }
  footer { margin-top: 3em; font-size: .85rem; color: #6b7280; }
</style>
</head>
<body>
<main>
  <h1>Vicar</h1>
  <p class="tag">Better pay for the people who do the hard work.</p>
  <p>We're building Vicar in Alabama and Mississippi for hardworking laborers and the companies that depend on them.</p>
  <span class="soon">Coming soon</span>
  <footer>&copy; 2026 Vicar Systems</footer>
</main>
</body>
</html>
