<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vicar Systems</title>
  <meta name="description" content="Vicar Systems — Coming soon.">
  <meta name="theme-color" content="#1F2B40">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="assets/vicar-icon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    :root {
      --navy: #1F2B40;
      --cream: #F4ECDC;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: var(--navy);
      color: var(--cream);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(100%, 28rem);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .logo {
      width: min(100%, 15.5rem);
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .tagline {
      margin: 2.25rem 0 0;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--cream);
    }
    .note {
      width: min(100%, 28rem);
      padding: 0 1.5rem 1.75rem;
      text-align: center;
      font-size: 0.72rem;
      line-height: 1.55;
      font-weight: 400;
      color: color-mix(in srgb, var(--cream) 68%, var(--navy));
    }
    .note p { margin: 0; }
    .note a { color: var(--cream); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/vicar-logo.svg" alt="Vicar Systems" width="612" height="791">
    <p class="tagline">Coming soon</p>
  </main>
  <footer class="note">
    <p>This page does not collect personal information, use cookies, or run analytics. The page is hosted on GitHub Pages and delivered through Cloudflare, which may log technical data such as IP addresses. Questions: <a href="mailto:noah@vicarsystems.com">noah@vicarsystems.com</a>.</p>
  </footer>
</body>
</html>
