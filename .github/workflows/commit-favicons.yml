name: Commit favicon assets

on:
  push:
    branches: [main]
    paths:
      - 'assets/*.b64'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode favicon assets and commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          for f in assets/*.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            rm "$f"
            git add -- "$out" "$f"
          done
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add decoded favicon assets"
          git push
